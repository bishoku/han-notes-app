[package]
name = "han-core"
version = "0.1.0"
description = "Shared Rust/WASM core parser for H.A.N. (Hierarchical Adaptive Notebook)"
license = "MIT"
repository = "https://github.com/bishoku/han-notes-app"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
