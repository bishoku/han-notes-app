name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/deploy-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Checkout wiki repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: .github_wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync wiki files
        run: |
          # Clean existing markdown files in wiki directory (keeping .git)
          find .github_wiki -maxdepth 1 -name "*.md" -delete

          # Copy updated markdown files
          cp -r wiki/* .github_wiki/

          cd .github_wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to sync in wiki."
          else
            git commit -m "docs(wiki): sync documentation from main [skip ci]"
            git push
          fi
